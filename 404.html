<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#171320">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171320'/%3E%3Cellipse cx='25' cy='45' rx='9.5' ry='7' transform='rotate(-22 25 45)' fill='%23F3D9A2'/%3E%3Crect x='31.5' y='12' width='3.6' height='33' rx='1.5' fill='%23F3D9A2'/%3E%3Cpath d='M35 12c4 7 13 9 11 21c-1-6-6-9-11-10z' fill='%23A8C2E8'/%3E%3C/svg%3E">
<title>ページが見つかりません | Luminote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<script data-goatcounter="https://luminote-music.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<style>
/* 2026-11 追加：見つからないページ（GitHub Pages が自動で出す） */
:root{--bg:#171320;--ivory:#EFE8DA;--ivory-dim:#B9B0A0;--brass:#D9B36C;--brass-hi:#F3D9A2;--moon:#A8C2E8;--line:rgba(239,232,218,0.16);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{background:radial-gradient(ellipse at 50% 0%,#2A2342 0%,var(--bg) 60%) fixed;color:var(--ivory);font-family:'Zen Kaku Gothic New',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 16px;text-align:center;}
.box{max-width:520px;width:100%;}
.wm{width:min(260px,70vw);height:auto;opacity:.95;}
.code{margin-top:26px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:.4em;color:var(--moon);text-indent:.4em;}
h1{margin-top:10px;font-family:'Shippori Mincho B1',serif;font-size:21px;font-weight:700;letter-spacing:.08em;color:var(--brass-hi);}
p{margin-top:14px;font-size:14.5px;line-height:2;color:var(--ivory);word-break:keep-all;}
p.en{margin-top:4px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15.5px;color:var(--ivory-dim);}
.orn{margin:24px auto 0;width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent);}
a.btn{display:inline-block;margin-top:28px;padding:13px 30px;border-radius:999px;text-decoration:none;font-size:14px;letter-spacing:.12em;color:#171320;background:linear-gradient(135deg,var(--brass-hi),var(--brass));box-shadow:0 10px 30px rgba(217,179,108,.35);transition:transform .25s;}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);}
</style>
</head>
<body>
<main class="box">
  <a href="/"><img class="wm" src="/img/luminote-wordmark.png" alt="Luminote"></a>
  <div class="code">404 · NOT FOUND</div>
  <h1>ページが見つかりませんでした</h1>
  <p>お探しのページは、<wbr>移動したか、<wbr>アドレスが少し違っているようです。</p>
  <p class="en">Sorry, this page could not be found.</p>
  <div class="orn" aria-hidden="true"></div>
  <a class="btn" href="/">トップページへ ／ Home</a>
</main>
</body>
</html>
